<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="ss-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Front card gradient (dynamic swipe) -->
    <linearGradient id="ss-card-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.85" />
    </linearGradient>

    <!-- Back card gradient (stacked card) -->
    <linearGradient id="ss-card-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Accent check / spark gradient -->
    <linearGradient id="ss-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="ss-drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>

    <filter id="ss-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base emblem squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ss-base-grad)" filter="url(#ss-drop-shadow)" />

  <!-- Inner border sheen -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />

  <!-- Back Card (Layered Tilt Left) -->
  <g transform="rotate(-10 20 25)">
    <rect x="10" y="11" width="18" height="24" rx="4" fill="url(#ss-card-back)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" />
  </g>

  <!-- Front Card (Swipe Action Tilt Right) -->
  <g transform="rotate(7 27 24)" filter="url(#ss-card-shadow)">
    <rect x="17" y="9" width="19" height="26" rx="4" fill="url(#ss-card-front)" stroke="rgba(255, 255, 255, 0.8)" stroke-width="1.2" />
    
    <!-- Mini simulated lines on card -->
    <rect x="20.5" y="14" width="12" height="2" rx="1" fill="#94a3b8" />
    <rect x="20.5" y="18" width="8" height="1.8" rx="0.9" fill="#cbd5e1" />

    <!-- Select / Verification Checkmark & Heart Hybrid -->
    <circle cx="26.5" cy="27" r="4.8" fill="url(#ss-spark-grad)" />
    <path d="M24.5 27L26 28.5L28.8 25.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Gesture Swipe Trails (Subtle speed lines on right) -->
  <path d="M39 17C41 19 41.5 22 41 25" stroke="#a5f3fc" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
  <path d="M41 20C42.2 21.5 42.5 23.5 42 25" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
</svg>
